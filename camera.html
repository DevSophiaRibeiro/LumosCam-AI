<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LumosCam — Câmera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .camera-screen { display: none; flex-direction: column; position: absolute; inset: 0; overflow: hidden; }
    .camera-screen.active { display: flex; }
    .feed-img { opacity: 0; transition: opacity 0.4s ease, filter 0.5s ease; width: 100%; height: 100%; object-fit: cover; }
    .feed-img.loaded { opacity: 1; }
    .vignette { position: absolute; inset: 0; pointer-events: none; transition: box-shadow 0.4s; }
    .flash { position: absolute; inset: 0; background: white; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.18s ease-out; }
    .flash.show { opacity: 1; transition: none; }
    .ai-toggle { transition: background 0.2s, border-color 0.2s, color 0.2s; }
    .ai-toggle.on { background: rgba(37,99,235,0.3); border-color: rgba(147,197,253,0.5); color: white; }
    .ai-toggle.on svg.sparkle { color: #bfdbfe; }
    .switch { transition: background 0.2s; }
    .switch.on { background: #2563eb; }
    .switch-knob { transition: left 0.2s; left: 2px; }
    .switch.on .switch-knob { left: 18px; }
    .scene-chip { background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); color: white; padding: 0.375rem 0.75rem; border-radius: 999px; font-size: 12px; display: flex; align-items: center; gap: 0.5rem; border: 1px solid rgba(255,255,255,0.1); animation: chipIn 0.25s ease; margin-top: 0.75rem; }
    .scene-chip .confidence { color: #93c5fd; }
    .scene-chip .auto-btn { background: none; border: none; color: #93c5fd; font-size: 12px; cursor: pointer; padding: 0; }
    @keyframes chipIn { from { transform: translateY(-8px); opacity: 0;} to { transform: translateY(0); opacity: 1;} }
    .modes-sheet { display: none; animation: sheetIn 0.22s ease; }
    .modes-sheet.show { display: block; }
    @keyframes sheetIn { from { transform: translateY(60px); opacity: 0;} to { transform: translateY(0); opacity: 1;} }
    .mode-btn { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.5rem 0.75rem; border-radius: 14px; min-width: 68px; flex-shrink: 0; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); border: none; transition: background 0.15s, color 0.15s; cursor: pointer; }
    .mode-btn.active { background: #2563eb; color: white; }
    
    .capture-toast { opacity: 0; transform: translateY(8px) scale(0.96); transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
    .capture-toast.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .info-toast { opacity: 0; transform: translate(-50%, 12px); transition: opacity 0.25s, transform 0.25s; }
    .info-toast.show { opacity: 1; transform: translate(-50%, 0); }
    .modes-open i { transform: rotate(180deg); transition: transform 0.2s; }
  </style>
</head>
<body class="bg-neutral-950 sm:flex sm:items-center sm:justify-center min-h-screen m-0 font-sans">
  
  <div class="relative w-full max-w-[480px] h-[100dvh] mx-auto overflow-hidden bg-black shadow-[0_0_60px_rgba(0,0,0,0.6)] sm:h-[min(100dvh,900px)] sm:rounded-[36px] flex flex-col">

    <!-- TELA 1: Permissão -->
    <div id="permissionScreen" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center px-8 text-center text-white z-[100]">
      <div class="mb-10 w-64 max-w-[80%] relative flex justify-center items-center">
        <div class="absolute w-32 h-16 bg-white/20 blur-3xl rounded-full pointer-events-none"></div>
        <img src="/img/logo.png" alt="LumosCam Logo" class="relative w-full h-auto object-contain drop-shadow-2xl"  />
      </div>
      <h2 class="text-[22px] font-bold mb-2">Permitir câmera</h2>
      <p class="text-slate-400 mb-8 text-[14px] leading-relaxed max-w-[320px]">O LumosCam analisa o ambiente para sugerir o melhor modo automaticamente. Sem permissão, não conseguimos te ajudar.</p>
      <button id="btnAllow" class="w-full bg-blue-600 text-white border-none rounded-2xl p-4 font-bold text-[15px] shadow-lg active:scale-95 transition-transform">Permitir acesso</button>
      <p id="deniedMsg" class="text-red-400 text-xs mt-4 hidden">Acesso negado. Tente novamente.</p>
    </div>

    <!-- TELA 2: Câmera -->
    <div id="cameraScreen" class="camera-screen">
      <div class="absolute inset-0">
        <img id="feedImg" class="feed-img" alt="Pré-visualização da câmera">
        <div id="vignette" class="vignette"></div>
        <div id="flash" class="flash"></div>
      </div>

      <!-- Top bar com Botão da Logo com Blur -->
      <div class="relative z-10 flex items-center justify-between pt-5 px-4">
        <a href="index.html" class="relative group flex items-center justify-center w-10 h-10 transition-transform active:scale-95" aria-label="Voltar para a Home">
          <!-- Blur de Destaque sutil atrás da seta -->
          <div class="absolute inset-0 bg-white/20 blur-md rounded-full pointer-events-none"></div>
          
          <!-- Seta < sutil e elegante -->
          <i data-lucide="chevron-left" class="relative w-6 h-6 text-white drop-shadow"></i>
        </a>
        <button id="aiToggle" class="ai-toggle flex items-center gap-2 backdrop-blur-md rounded-full py-1.5 pr-2 pl-3 border border-white/15 bg-black/40 text-white/70">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 sparkle"></i>
          <span class="text-[11px] tracking-wider">LumosCam AI</span>
          <span id="aiSwitch" class="switch w-9 h-5 rounded-full relative bg-slate-600 ml-1"><span class="switch-knob absolute top-[2px] w-4 h-4 rounded-full bg-white shadow-sm"></span></span>
        </button>
      </div>

      <div id="sceneChipWrap" class="relative z-10 flex flex-col items-center"></div>
      <div class="flex-1"></div>

      <div id="modesSheet" class="modes-sheet relative z-20 mx-4 mb-3 bg-black/60 backdrop-blur-xl rounded-[20px] p-3 border border-white/10">
        <div class="flex justify-between items-center mb-2 px-1">
          <span class="text-white text-xs">Sugestões da IA</span>
          <button id="closeModes" class="text-white/60 text-xs bg-transparent border-none cursor-pointer hover:text-white transition">fechar</button>
        </div>
        <div id="modesRow" class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide"></div>
      </div>

      <a href="galeria.html" id="captureToast" class="capture-toast absolute left-6 bottom-[8.5rem] z-40 flex items-center gap-3 bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-[14px] p-2 pr-4 text-white shadow-xl hover:bg-slate-800 transition-colors">
        <img id="captureToastImg" src="" class="w-10 h-10 rounded-lg object-cover shadow-sm">
        <div class="flex flex-col">
          <b class="text-[13px] text-white">Foto salva</b>
          <span class="text-[11px] text-blue-400 font-medium mt-0.5 flex items-center gap-1">Ver na galeria <i data-lucide="arrow-right" class="w-3 h-3"></i></span>
        </div>
      </a>
      
      <div id="infoToast" class="info-toast absolute left-1/2 bottom-8 z-[60] bg-slate-900/92 text-white text-[13px] px-4 py-2.5 rounded-xl border border-white/12 whitespace-nowrap"></div>

      <!-- Bottom Bar -->
      <div class="relative z-10 px-6 py-3 pb-8 flex items-center justify-between bg-gradient-to-t from-black/80 via-black/50 to-transparent">
        <button id="btnCopyStyle" class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:scale-95 transition-transform"><i data-lucide="wand-2" class="w-5 h-5"></i></button>
        <button id="btnCapture" class="w-20 h-20 rounded-full border-4 border-white/70 p-1 bg-transparent active:scale-95 transition-transform"><span class="block w-full h-full rounded-full bg-white shadow-[0_0_20px_rgba(255,255,255,0.45)]"></span></button>
        <button id="btnModes" class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:scale-95 transition-transform"><i data-lucide="chevron-up" class="w-5 h-5 transition-transform duration-200"></i></button>
      </div>
    </div>
  </div>
  <script src="JS/camera.js"></script>
</body>
</html>
