<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LumosCam — Filtros</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/filtros.css" />
</head>
<body class="bg-neutral-950 sm:flex sm:items-center sm:justify-center min-h-screen m-0 font-['Inter']">

  <!-- Container Simulador de Smartphone -->
  <div class="relative w-full max-w-[480px] h-[100dvh] mx-auto overflow-hidden bg-white shadow-[0_0_60px_rgba(0,0,0,0.6)] sm:h-[min(100dvh,900px)] sm:rounded-[36px] flex flex-col">

    <main class="flex-1 overflow-hidden relative flex flex-col bg-white">
      <!-- Header -->
      <header class="relative overflow-hidden bg-white border-b border-slate-100 shrink-0 shadow-sm z-10">
        <div class="relative px-5 pt-6 pb-4 flex items-center gap-4">
          <div class="relative flex items-center justify-center shrink-0">
            <div class="absolute inset-0 bg-blue-400/20 blur-xl rounded-full pointer-events-none"></div>
            <img src="/img/logo.png" alt="LumosCam Logo" class="relative w-[72px] h-[72px] object-contain drop-shadow-sm">
          </div>
          <div class="flex-1 min-w-0">
            <h1 class="truncate text-[#0f2441] font-bold text-[22px] leading-tight mb-0.5">Filtros</h1>
            <p class="text-[13px] text-[#4878b4] font-medium tracking-tight">Estilos premium curados pela equipe</p>
          </div>
        </div>
      </header>

      <!-- Lista de Itens dos Filtros -->
      <div id="community-list" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 scrollbar-hide">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </main>

    <!-- MODAL DE DETALHES (Bottom Sheet) -->
    <div id="filterModal" class="absolute inset-0 z-[100] hidden flex-col justify-end pointer-events-none">
      <!-- Overlay escuro -->
      <div id="modalOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto"></div>
      
      <!-- Conteúdo da Modal -->
      <div id="modalContent" class="relative bg-white w-full rounded-t-[32px] p-6 pt-2 transform translate-y-full transition-transform duration-300 max-h-[85%] flex flex-col pointer-events-auto shadow-2xl">
        
        <!-- Puxador (detalhe estético superior) -->
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto my-3"></div>
        
        <!-- Botão Fechar -->
        <button id="closeModalBtn" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

        <div class="overflow-y-auto pb-4 scrollbar-hide flex-1">
          <div class="flex items-center gap-4 mb-5 mt-2">
            <img id="modalIcon" src="" class="w-20 h-20 rounded-2xl object-cover shadow-sm">
            <div>
              <h2 id="modalTitle" class="text-xl font-bold text-slate-900 leading-tight"></h2>
              <p id="modalAuthor" class="text-[13px] text-blue-600 font-medium"></p>
              <div class="flex items-center gap-3 text-xs text-slate-500 mt-1.5">
                <span class="flex items-center gap-1 font-medium">
                  <i data-lucide="star" class="w-3.5 h-3.5 text-amber-400 fill-amber-400"></i> 
                  <span id="modalRating"></span>
                </span>
                <span id="modalDownloads"></span>
              </div>
            </div>
          </div>
          
          <h3 class="text-sm font-bold text-slate-900 mb-1.5">Sobre o filtro</h3>
          <p id="modalDesc" class="text-[13px] text-slate-600 leading-relaxed mb-6"></p>

          <h3 class="text-sm font-bold text-slate-900 mb-3">Exemplos</h3>
          <!-- Galeria de Exemplos -->
          <div id="modalGallery" class="flex gap-2.5 overflow-x-auto pb-2 scrollbar-hide snap-x">
            <!-- Imagens injetadas via JS -->
          </div>
          
          <!-- Botão Baixar Dentro da Modal -->
          <button id="modalDownloadBtn" class="w-full mt-6 rounded-2xl p-4 font-bold text-[15px] shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
            <!-- Conteúdo alterado pelo JS -->
          </button>
        </div>
      </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="storeToast" class="store-toast absolute left-1/2 bottom-24 z-50 bg-slate-900/95 text-white text-[13px] px-4 py-2.5 rounded-xl border border-white/12 shadow-2xl flex items-center gap-2 whitespace-nowrap">
      <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
      <span id="toastMsg">Filtro adicionado!</span>
    </div>

    <!-- Nav Bar -->
    <nav class="flex justify-around items-center h-[68px] pb-3 pt-2 bg-white border-t border-slate-200 shrink-0 z-20">
      <a href="index.html" class="flex flex-col items-center justify-center w-14 gap-1 text-slate-400 hover:text-slate-600 transition-colors"><i data-lucide="home" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium">Início</span></a>
      <a href="filtros.html" class="flex flex-col items-center justify-center w-14 gap-1 text-[#0f2441] transition-colors"><i data-lucide="sliders-horizontal" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-bold">Filtros</span></a>
      <a href="camera.html" class="flex flex-col items-center justify-center w-14 gap-1 text-slate-400 hover:text-slate-600 transition-colors"><i data-lucide="camera" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium">Câmera</span></a>
      <a href="comunidade.html" class="flex flex-col items-center justify-center w-14 gap-1 text-slate-400 hover:text-slate-600 transition-colors"><i data-lucide="users" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium">Comunidade</span></a>
      <a href="galeria.html" class="flex flex-col items-center justify-center w-14 gap-1 text-slate-400 hover:text-slate-600 transition-colors"><i data-lucide="image" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium">Galeria</span></a>
    </nav>
  </div>

  <script src="JS/filtros.js"></script>
</body>
</html>
